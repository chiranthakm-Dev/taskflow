apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskflow.fullname" . }}-worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "taskflow.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "taskflow.name" . }}-worker
    spec:
      containers:
        - name: worker
          image: {{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}
          env:
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "taskflow.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
            - name: RABBITMQ_URL
              value: amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ include "taskflow.fullname" . }}-rabbitmq:5672