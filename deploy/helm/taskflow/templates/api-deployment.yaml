apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskflow.fullname" . }}-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "taskflow.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "taskflow.name" . }}-api
    spec:
      containers:
        - name: api
          image: {{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "taskflow.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
            - name: RABBITMQ_URL
              value: amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ include "taskflow.fullname" . }}-rabbitmq:5672